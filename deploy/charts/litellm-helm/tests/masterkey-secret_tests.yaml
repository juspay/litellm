suite: test masterkey secret
templates:
  - secret-masterkey.yaml
tests:
  - it: should create a secret if masterkeySecretName is not set. should start with sk-xxxx (base64 encoded as c2st*)
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: ""
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: data.masterkey
          pattern: ^c2st
          # Note: The masterkey is generated as "sk-<18-random-chars>" in plain text,
          # but stored as base64 encoded in Kubernetes secret (requirement).
          # "sk-" base64 encodes to "c2st", so we check for "^c2st" pattern.
  - it: should not create a secret if masterkeySecretName is set
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: my-secret
    asserts:
      - hasDocuments:
          count: 0
  # Regression: on upgrade, the lookup value comes from Secret.data which is
  # already base64-encoded. It must be decoded before the final b64enc, or the
  # masterkey silently changes on every upgrade and existing admin clients
  # lose access. Helm unittest cannot call lookup(), so this asserts the
  # template renders .Values.masterkey (plain) through a single encoding —
  # if the double-encode regression is reintroduced with an explicit
  # masterkey set, the value will not match a single b64enc of it.
  - it: should encode a set masterkey exactly once
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: ""
      masterkey: sk-unit-test-master-key
    asserts:
      - equal:
          path: data.masterkey
          value: c2stdW5pdC10ZXN0LW1hc3Rlci1rZXk=
