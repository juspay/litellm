{{- if not .Values.masterkeySecretName }}
{{- $secretName := printf "%s-masterkey" (include "litellm.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingKey := "" }}
{{- if $existing }}
{{- $existingKey = index $existing.data "masterkey" | default "" }}
{{- end }}
{{- $masterkey := .Values.masterkey | default $existingKey | default (printf "sk-%s" (randAlphaNum 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
data:
  masterkey: {{ $masterkey | b64enc }}
type: Opaque
{{- end }}
