{{- if .Values.db.deployStandalone -}}
{{- $postgresPassword := index .Values.postgresql.auth "postgres-password" }}
{{- $appPassword := .Values.postgresql.auth.password }}
{{- if not $postgresPassword }}
{{- fail "postgresql.auth.postgres-password must be set (use --set or an external secret)" }}
{{- end }}
{{- if not $appPassword }}
{{- fail "postgresql.auth.password must be set (use --set or an external secret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.fullname" . }}-dbcredentials
data:
  # Password for the "postgres" user
  postgres-password: {{ $postgresPassword | b64enc }}
  username: {{ .Values.postgresql.auth.username | default "litellm" | b64enc }}
  password: {{ $appPassword | b64enc }}
type: Opaque
{{- end -}}
