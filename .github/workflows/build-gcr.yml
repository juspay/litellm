name: Build and Push to GCR

on:
  push:
    branches:
      - main
      - hotfix/**
      - sync/v*
  workflow_dispatch:  # allows manual trigger for testing

env:
  IMAGE_NAME: litellm
  PROD_PROJECT: xyne-prod
  SANDBOX_PROJECT: xyne-dev-461113

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: "Build & Push to GCR"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short commit SHA
        id: commit
        run: echo "sha=$(git rev-parse --short=6 HEAD)" >> $GITHUB_OUTPUT

      - name: Set image tags
        id: image
        run: |
          TAG_SUFFIX="${{ steps.commit.outputs.sha }}-juspay-build-v${{ github.run_number }}"
          PROD_TAG="gcr.io/${{ env.PROD_PROJECT }}/${{ env.IMAGE_NAME }}:${TAG_SUFFIX}"
          SANDBOX_TAG="gcr.io/${{ env.SANDBOX_PROJECT }}/${{ env.IMAGE_NAME }}:${TAG_SUFFIX}"
          echo "prod_tag=${PROD_TAG}" >> $GITHUB_OUTPUT
          echo "sandbox_tag=${SANDBOX_TAG}" >> $GITHUB_OUTPUT
          echo "Prod image tag: ${PROD_TAG}"
          echo "Sandbox image tag: ${SANDBOX_TAG}"

      - name: Authenticate to Google Cloud (prod)
        id: auth-prod
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      - name: Authenticate to Google Cloud (sandbox)
        id: auth-sandbox
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY_SANDBOX }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.non_root
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.prod_tag }}
            ${{ steps.image.outputs.sandbox_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ steps.commit.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | \`${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.image.outputs.prod_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.image.outputs.sandbox_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.image.outputs.prod_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ steps.image.outputs.sandbox_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
