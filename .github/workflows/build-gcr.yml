name: Build and Push to GHCR

# The xyne GCP projects sit inside a VPC Service Controls perimeter, so
# GitHub-hosted runners can no longer push to gcr.io/<project>/litellm.
# CI publishes once to the public GHCR package instead; each GCP project pulls
# it through its own Artifact Registry remote repository (pull-through cache).
#
#   CI pushes:  ghcr.io/juspay/litellm:<sha6>-juspay-build-v<run>
#   Projects:   xyne-prod, xyne-dev-461113, xyne-infra-external
#               asia-south1-docker.pkg.dev/<project>/<remote-repo>/juspay/litellm:<tag>
#
# File name kept as build-gcr.yml so the run number (part of the tag) keeps
# counting from the previous builds.

on:
  push:
    branches:
      - main
      - hotfix/**
      - sync/v*
      - feature/*
      - release/*
      - feature/ghcr-public  # TEMP: test the GHCR push before merge; remove before merging
  workflow_dispatch:  # allows manual trigger for testing

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/juspay/litellm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set image tag
        id: image
        run: |
          SHA="$(git rev-parse --short=6 HEAD)"
          TAG="${SHA}-juspay-build-v${GITHUB_RUN_NUMBER}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_REPOSITORY}:${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0  # v5.3.0
        with:
          context: .
          file: ./docker/Dockerfile.non_root
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.image.outputs.tag }}
          # Links the GHCR package to this repo so GITHUB_TOKEN keeps write access.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PROXY_EXTRAS_SOURCE=local

      - name: Build Summary
        env:
          TAG: ${{ steps.image.outputs.tag }}
          SHA: ${{ steps.image.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Commit SHA | \`${SHA}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Build Number | \`${GITHUB_RUN_NUMBER}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            echo "### Image Pushed"
            echo "\`\`\`"
            echo "${IMAGE_REPOSITORY}:${TAG}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
